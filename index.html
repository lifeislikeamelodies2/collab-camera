<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>コラボカメラ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --panel: #1b1b1b;
      --line: #3a3a3a;
      --text: #fff;
      --muted: #bdbdbd;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(100%, 560px);
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(20px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      min-height: 44px;
      padding: 9px 13px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    #character {
      position: absolute;
      left: 0;
      top: 0;
      width: 45%;
      height: auto;
      transform-origin: center center;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-drag: none;
      user-select: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.22));
    }

    .startLayer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.48);
      z-index: 4;
      padding: 22px;
      text-align: center;
    }

    .startLayer[hidden] {
      display: none !important;
    }

    .startBox {
      width: min(100%, 320px);
      background: rgba(20,20,20,.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }

    .startBox p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .startBox button {
      width: 100%;
      background: #fff;
      color: #111;
      font-weight: 700;
    }

    .status {
      min-height: 22px;
      margin: 8px 2px 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .selectorTitle {
      font-size: 13px;
      color: var(--muted);
      margin: 8px 2px 7px;
    }

    .characters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 8px;
      scrollbar-width: none;
    }

    .characters::-webkit-scrollbar { display: none; }

    .charBtn {
      flex: 0 0 78px;
      padding: 5px;
      min-height: 88px;
      display: grid;
      gap: 4px;
      align-content: center;
      justify-items: center;
    }

    .charBtn.active {
      outline: 2px solid #fff;
      outline-offset: 1px;
    }

    .charBtn img {
      display: block;
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 9px;
      background: repeating-conic-gradient(#2d2d2d 0 25%, #242424 0 50%) 50% / 12px 12px;
    }

    .charBtn span {
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.45fr 1fr;
      gap: 8px;
      margin-top: 7px;
    }

    .shoot {
      background: #fff;
      color: #111;
      font-weight: 800;
      border-color: #fff;
    }

    dialog {
      width: min(calc(100% - 20px), 540px);
      max-height: calc(100dvh - 24px);
      overflow: auto;
      color: var(--text);
      background: #151515;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
    }

    dialog::backdrop {
      background: rgba(0,0,0,.72);
    }

    .previewImg {
      display: block;
      width: 100%;
      border-radius: 14px;
      background: #000;
    }

    .previewButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .save {
      background: #fff;
      color: #111;
      font-weight: 800;
      border-color: #fff;
    }

    .hint {
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1 class="title">コラボカメラ</h1>
      <button id="switchCamera" type="button" disabled>カメラ切替</button>
    </div>

    <section id="stage" class="stage" aria-label="カメラプレビュー">
      <video id="video" autoplay muted playsinline></video>
      <img id="character" src="images/character1.png" alt="選択中のキャラクター" draggable="false">

      <div id="startLayer" class="startLayer">
        <div class="startBox">
          <p>「カメラを開始」を押したあと、ブラウザからカメラ利用の確認が出たら許可してください。</p>
          <button id="startCamera" type="button">カメラを開始</button>
        </div>
      </div>
    </section>

    <div id="status" class="status" aria-live="polite">キャラクターは指1本で移動、2本指で拡大・縮小できます。</div>

    <div class="selectorTitle">キャラクターを選択</div>
    <div class="characters" id="characters">
      <button class="charBtn active" type="button" data-src="images/character1.png" data-name="キャラ1">
        <img src="images/character1.png" alt="">
        <span>キャラ1</span>
      </button>
      <button class="charBtn" type="button" data-src="images/character2.png" data-name="キャラ2">
        <img src="images/character2.png" alt="">
        <span>キャラ2</span>
      </button>
      <button class="charBtn" type="button" data-src="images/character3.png" data-name="キャラ3">
        <img src="images/character3.png" alt="">
        <span>キャラ3</span>
      </button>
    </div>

    <div class="controls">
      <button id="reset" type="button">位置リセット</button>
      <button id="shoot" class="shoot" type="button" disabled>撮影</button>
      <button id="smaller" type="button">少し縮小</button>
    </div>

    <p class="hint">
      撮影画像はサーバーへ送信せず、このブラウザ内で合成します。「保存・共有」では、対応端末なら共有メニューを開きます。
    </p>
  </main>

  <dialog id="previewDialog">
    <img id="previewImg" class="previewImg" alt="撮影結果">
    <div class="previewButtons">
      <button id="retake" type="button">撮り直す</button>
      <button id="save" class="save" type="button">保存・共有</button>
    </div>
    <p class="hint">iPhoneでは共有メニューから「画像を保存」を選ぶと写真アプリへ保存できます。</p>
  </dialog>

  <canvas id="canvas" hidden></canvas>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const video = document.getElementById('video');
      const character = document.getElementById('character');
      const startLayer = document.getElementById('startLayer');
      const startCameraBtn = document.getElementById('startCamera');
      const switchCameraBtn = document.getElementById('switchCamera');
      const shootBtn = document.getElementById('shoot');
      const resetBtn = document.getElementById('reset');
      const smallerBtn = document.getElementById('smaller');
      const statusEl = document.getElementById('status');
      const canvas = document.getElementById('canvas');
      const dialog = document.getElementById('previewDialog');
      const previewImg = document.getElementById('previewImg');
      const retakeBtn = document.getElementById('retake');
      const saveBtn = document.getElementById('save');

      let stream = null;
      let facingMode = 'environment';
      let latestBlob = null;
      let latestObjectUrl = null;

      const state = {
        x: 0,
        y: 0,
        scale: 1,
        baseWidth: 0,
        initialized: false
      };

      const pointers = new Map();
      let dragStart = null;
      let pinchStart = null;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function updateCharacterTransform() {
        character.style.width = `${state.baseWidth}px`;
        character.style.transform =
          `translate(${state.x}px, ${state.y}px) translate(-50%, -50%) scale(${state.scale})`;
      }

      function resetCharacter() {
        const rect = stage.getBoundingClientRect();
        state.baseWidth = rect.width * 0.46;
        state.x = rect.width * 0.50;
        state.y = rect.height * 0.56;
        state.scale = 1;
        state.initialized = true;
        updateCharacterTransform();
      }

      function clampScale(value) {
        return Math.min(3.5, Math.max(0.18, value));
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus('このブラウザではカメラ機能を利用できません。SafariまたはChromeでHTTPSページを開いてください。');
          return;
        }

        startCameraBtn.disabled = true;
        setStatus('カメラを起動しています…');

        try {
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }

          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1920 },
              height: { ideal: 1440 }
            }
          });

          video.srcObject = stream;
          await video.play();

          video.classList.toggle('mirror', facingMode === 'user');
          startLayer.hidden = true;
          startLayer.style.display = 'none';
          switchCameraBtn.disabled = false;
          shootBtn.disabled = false;

          if (!state.initialized) resetCharacter();

          setStatus('指1本で移動、2本指で拡大・縮小できます。');
        } catch (err) {
          console.error(err);
          startCameraBtn.disabled = false;
          setStatus('カメラを開始できませんでした。ブラウザのカメラ権限を確認してください。');
        }
      }

      async function switchCamera() {
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        await startCamera();
      }

      function pointFromEvent(e) {
        const r = stage.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      character.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        character.setPointerCapture(e.pointerId);
        const p = pointFromEvent(e);
        pointers.set(e.pointerId, p);

        if (pointers.size === 1) {
          dragStart = {
            pointer: p,
            x: state.x,
            y: state.y
          };
          pinchStart = null;
        } else if (pointers.size === 2) {
          const pts = [...pointers.values()];
          pinchStart = {
            distance: Math.max(1, distance(pts[0], pts[1])),
            scale: state.scale
          };
          dragStart = null;
        }
      });

      character.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        e.preventDefault();

        pointers.set(e.pointerId, pointFromEvent(e));

        if (pointers.size === 1 && dragStart) {
          const p = [...pointers.values()][0];
          state.x = dragStart.x + (p.x - dragStart.pointer.x);
          state.y = dragStart.y + (p.y - dragStart.pointer.y);
          updateCharacterTransform();
        } else if (pointers.size >= 2 && pinchStart) {
          const pts = [...pointers.values()].slice(0, 2);
          const d = Math.max(1, distance(pts[0], pts[1]));
          state.scale = clampScale(pinchStart.scale * (d / pinchStart.distance));
          updateCharacterTransform();
        }
      });

      function endPointer(e) {
        pointers.delete(e.pointerId);

        if (pointers.size === 1) {
          const p = [...pointers.values()][0];
          dragStart = { pointer: p, x: state.x, y: state.y };
          pinchStart = null;
        } else if (pointers.size === 0) {
          dragStart = null;
          pinchStart = null;
        }
      }

      character.addEventListener('pointerup', endPointer);
      character.addEventListener('pointercancel', endPointer);

      document.getElementById('characters').addEventListener('click', async (e) => {
        const btn = e.target.closest('.charBtn');
        if (!btn) return;

        document.querySelectorAll('.charBtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        character.src = btn.dataset.src;
        character.alt = btn.dataset.name || '選択中のキャラクター';

        try {
          await character.decode();
        } catch (_) {}

        resetCharacter();
        setStatus(`${btn.dataset.name}を選択しました。`);
      });

      function calculateVideoCrop(videoW, videoH, boxW, boxH) {
        const videoRatio = videoW / videoH;
        const boxRatio = boxW / boxH;

        if (videoRatio > boxRatio) {
          const srcH = videoH;
          const srcW = videoH * boxRatio;
          return {
            sx: (videoW - srcW) / 2,
            sy: 0,
            sw: srcW,
            sh: srcH
          };
        }

        const srcW = videoW;
        const srcH = videoW / boxRatio;
        return {
          sx: 0,
          sy: (videoH - srcH) / 2,
          sw: srcW,
          sh: srcH
        };
      }

      async function capture() {
        if (!video.videoWidth || !video.videoHeight) {
          setStatus('カメラ映像の準備ができていません。');
          return;
        }

        const rect = stage.getBoundingClientRect();
        const outW = Math.round(rect.width * Math.min(devicePixelRatio || 1, 3));
        const outH = Math.round(rect.height * Math.min(devicePixelRatio || 1, 3));
        const ratioX = outW / rect.width;
        const ratioY = outH / rect.height;

        canvas.width = outW;
        canvas.height = outH;
        const ctx = canvas.getContext('2d');

        const crop = calculateVideoCrop(
          video.videoWidth,
          video.videoHeight,
          rect.width,
          rect.height
        );

        ctx.save();

        if (facingMode === 'user') {
          ctx.translate(outW, 0);
          ctx.scale(-1, 1);
        }

        ctx.drawImage(
          video,
          crop.sx, crop.sy, crop.sw, crop.sh,
          0, 0, outW, outH
        );

        ctx.restore();

        if (!character.complete) {
          try { await character.decode(); } catch (_) {}
        }

        const naturalRatio =
          character.naturalWidth && character.naturalHeight
            ? character.naturalHeight / character.naturalWidth
            : 1;

        const drawW = state.baseWidth * state.scale * ratioX;
        const drawH = state.baseWidth * naturalRatio * state.scale * ratioY;
        const centerX = state.x * ratioX;
        const centerY = state.y * ratioY;

        ctx.drawImage(
          character,
          centerX - drawW / 2,
          centerY - drawH / 2,
          drawW,
          drawH
        );

        canvas.toBlob((blob) => {
          if (!blob) {
            setStatus('画像の作成に失敗しました。');
            return;
          }

          latestBlob = blob;

          if (latestObjectUrl) URL.revokeObjectURL(latestObjectUrl);
          latestObjectUrl = URL.createObjectURL(blob);
          previewImg.src = latestObjectUrl;

          if (typeof dialog.showModal === 'function') {
            dialog.showModal();
          } else {
            window.open(latestObjectUrl, '_blank');
          }
        }, 'image/jpeg', 0.94);
      }

      async function saveOrShare() {
        if (!latestBlob) return;

        const file = new File(
          [latestBlob],
          `collab-camera-${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`,
          { type: 'image/jpeg' }
        );

        try {
          if (navigator.share && navigator.canShare?.({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'コラボカメラ'
            });
            return;
          }
        } catch (err) {
          if (err?.name === 'AbortError') return;
          console.warn(err);
        }

        const a = document.createElement('a');
        a.href = latestObjectUrl;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      startCameraBtn.addEventListener('click', startCamera);
      switchCameraBtn.addEventListener('click', switchCamera);
      resetBtn.addEventListener('click', resetCharacter);
      smallerBtn.addEventListener('click', () => {
        state.scale = clampScale(state.scale * 0.85);
        updateCharacterTransform();
      });
      shootBtn.addEventListener('click', capture);
      retakeBtn.addEventListener('click', () => dialog.close());
      saveBtn.addEventListener('click', saveOrShare);

      window.addEventListener('resize', () => {
        if (!state.initialized) return;
        const oldBase = state.baseWidth || 1;
        const oldRectWidth = oldBase / 0.46;
        const newRect = stage.getBoundingClientRect();
        const k = newRect.width / oldRectWidth;

        state.x *= k;
        state.y *= k;
        state.baseWidth = newRect.width * 0.46;
        updateCharacterTransform();
      });

      resetCharacter();
    })();
  </script>
</body>
</html>
